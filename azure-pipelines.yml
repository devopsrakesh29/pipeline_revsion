trigger: none
#  branches:
#    include:
#      - main
#      - feature/*

pool: 
 name: pipeline-agent


stages:
  - stage: pre_build
    displayName: pre build 1
    jobs: 
      - job: tf_setup
        pool: pipeline-agent
        displayName: tf_setup
        steps:
        - task: TerraformInstaller@1
          displayName: tf_setup
          inputs:
            terraformVersion: 'latest'
      - job: prebuild
        dependsOn: tf_setup
        displayName: terraform plan
        steps:
        - task: TerraformTask@5
          displayName: tf init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'pileline-sc'
            backendAzureRmStorageAccountName: 'tfbackendstg123'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'dev.terraform.tfstate'

        - task: TerraformTask@5
          displayName: tf plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'pileline-sc'

  # - stage: ManualValidation
  #   dependsOn: pre_build
  #   displayName: Manual Validation
  #   jobs:
  #     - job: ManualValidation
  #       pool: server
  #       displayName: Manual Validation job
  #       steps:
  #       - task: ManualValidation@1
  #         displayName: manual validation task
  #         inputs:
  #           notifyUsers: 'singhrakesh2986@gmail.com'

  - stage: apply
    condition:  and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
     )
    displayName: apply stage
    dependsOn: pre_build
    jobs:
      - deployment: manualApproval
        environment: dev
        strategy: 
          runOnce:
            deploy:
              steps:
              - task: TerraformTask@5
                displayName: tf init
                inputs:
                  provider: 'azurerm'
                  command: 'init'
                  backendServiceArm: 'pileline-sc'
                  backendAzureRmStorageAccountName: 'tfbackendstg123'
                  backendAzureRmContainerName: 'tfstate'
                  backendAzureRmKey: 'dev.terraform.tfstate'
              - task: TerraformTask@5
                displayName: terraform apply
                inputs:
                  provider: 'azurerm'
                  command: 'apply'
                  environmentServiceNameAzureRM: 'pileline-sc'